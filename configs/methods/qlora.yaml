method:
  type: "qlora"
  quantization: "nf4"
  double_quant: true
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  target_modules: "all-linear"
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  num_epochs: 3
  max_seq_len: 4096
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  optimizer: "paged_adamw_8bit"
