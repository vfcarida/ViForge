[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viforge"
version = "0.1.0"
description = "ViForge: Forging Small Models into Domain Specialists — A Systematic Post-Training & Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ViForge Authors", email = "research@viforge.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "safetensors>=0.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "xxhash>=3.4.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-tools>=7.4.0",
    "pre-commit>=3.7.0"
]
aws = [
    "boto3>=1.34.0",
    "sagemaker>=2.210.0"
]
inference = [
    "vllm>=0.4.0; sys_platform != 'win32'",
    "litellm>=1.35.0"
]
all = [
    "viforge[dev,aws,inference]"
]

[project.scripts]
viforge = "viforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["viforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
