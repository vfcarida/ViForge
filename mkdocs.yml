site_name: ViForge
site_description: Forging Small Models into Domain Specialists — A Systematic Post-Training & Evaluation Framework
site_author: ViForge Authors
repo_url: https://github.com/vfcarida/ViForge
repo_name: vfcarida/ViForge
site_url: https://vfcarida.github.io/ViForge/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - System Overview: architecture/README.md
      - Unified Pareto & Studio: architecture/unified_pareto.md
      - Reference-Free Alignment (ORPO & SimPO): research/reference_free_alignment.md
  - Case Studies:
      - DeepSeek V4 Pro SWE: case-studies/deepseek-v4-pro-swe.md
  - Integrations:
      - ViPym Compression: integrations/vipym.md
  - Quality & Testing:
      - Testing Guide: testing/README.md
  - Audit & Plan:
      - Deep Repository Audit: audit/README.md
