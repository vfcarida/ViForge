name: ViForge CI

on:
  push:
    branches: [main, master, "v*"]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/dev.lock
          pip install -e . --no-deps

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/

      - name: Run Ruff Format Check
        run: |
          ruff format --check src/ tests/

      - name: Run Mypy Type Check
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest tests/ -v --cov=src/viforge --cov-fail-under=70

      - name: Run Smoke Verification (Offline & Live Micro-Training)
        run: |
          pytest tests/smoke/ -v

      - name: Run Security Audit
        run: |
          pip-audit --strict --desc

      - name: Test CLI Doctor
        run: |
          viforge doctor

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker Image (Syntax & Layer Check)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: viforge:test

